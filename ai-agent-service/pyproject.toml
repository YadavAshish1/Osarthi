[project]
name = "osarthi-ai-agent"
version = "0.1.0"
description = "Agentic AI Chatbot Service for Osarthi EdTech Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # LLM providers
    "openai>=1.50.0",
    "google-genai>=1.0.0",

    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",

    # MCP
    "mcp>=1.0.0",

    # RAG & Vector store
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",

    # MongoDB
    "motor>=3.6.0",
    "pymongo>=4.9.0",

    # Azure SDKs
    "azure-identity>=1.18.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-mgmt-web>=7.3.0",

    # Auth
    "pyjwt>=2.9.0",

    # Utilities
    "httpx>=0.27.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --port 8000"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
